name: Vault check

# Runs the vault through the real Dataview engine: frontmatter, Templater templates,
# hotkey snippets, every dataview query and every dashboard block, with and without
# the demo data. If you use this repo as your personal vault you can delete .github/.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install tool dependencies
        run: npm ci --prefix tools
      - name: Check the vault (with the demo data laid over it)
        run: node tools/check-vault.cjs --demo
